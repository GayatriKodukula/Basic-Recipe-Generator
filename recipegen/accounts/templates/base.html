<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RecipeGen{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e63946;
            --secondary: #2ec4b6;
            --accent: #7b2d8b;
            --success-green: #2e7d32;
            --sidebar-w: 240px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; overflow-x: hidden; background: #f5f5f5; }
        a { text-decoration: none; }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed; top: 0; left: 0;
            width: var(--sidebar-w); height: 100vh;
            background: #fff;
            box-shadow: 2px 0 14px rgba(0,0,0,0.08);
            display: flex; flex-direction: column;
            z-index: 200; padding: 0;
        }
        .sidebar-brand {
            display: flex; align-items: center; gap: 8px;
            padding: 18px 20px;
            font-size: 1.15rem; font-weight: 700; color: var(--primary);
            border-bottom: 1px solid #f0f0f0;
        }
        .sidebar-brand i { font-size: 1rem; }
        .hamburger { margin-left: auto; color: #777; font-size: 1rem; cursor: pointer; }
        .sidebar-nav { flex: 1; padding: 16px 0; }
        .sidebar-nav a {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 24px; color: #555;
            font-size: 0.93rem; font-weight: 500;
            transition: background .18s, color .18s;
            border-radius: 0 30px 30px 0; margin-right: 16px;
        }
        .sidebar-nav a:hover,
        .sidebar-nav a.active { background: #fdf0f0; color: var(--primary); }
        .sidebar-nav a i { width: 18px; text-align: center; }
        .sidebar-logout { padding: 16px 24px; border-top: 1px solid #f0f0f0; }
        .sidebar-logout a {
            display: flex; align-items: center; gap: 10px;
            color: var(--primary); font-weight: 600; font-size: 0.93rem;
        }
        .sidebar-logout a:hover { opacity: .75; }

        /* ── Main ── */
        .main-content { margin-left: var(--sidebar-w); min-height: 100vh; }

        /* ── Toast ── */
        .toast-container { position: fixed; top: 18px; right: 18px; z-index: 9999; min-width: 280px; }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>

{% if user.is_authenticated %}
<aside class="sidebar">
    <a href="{% url 'dashboard' %}" class="sidebar-brand">
        <i class="fas fa-utensils"></i> RecipeGen
        <span class="hamburger"><i class="fas fa-bars"></i></span>
    </a>
    <nav class="sidebar-nav">
        <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
            <i class="fas fa-home"></i> Dashboard
        </a>
        <a href="{% url 'history' %}" class="{% if request.resolver_match.url_name == 'history' %}active{% endif %}">
            <i class="fas fa-history"></i> History
        </a>
        <a href="{% url 'profile' %}" class="{% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
            <i class="fas fa-user"></i> Profile
        </a>
    </nav>
    <div class="sidebar-logout">
        <a href="{% url 'logout' %}"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
</aside>
<div class="main-content">
{% else %}
<div>
{% endif %}

{% if messages %}
<div class="toast-container">
    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow-sm" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
</div>
{% endif %}

{% block content %}{% endblock %}

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
