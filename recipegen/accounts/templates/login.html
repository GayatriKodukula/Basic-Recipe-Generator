<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – RecipeGen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=1600&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: rgba(30, 30, 30, 0.72);
            backdrop-filter: blur(6px);
            border-radius: 14px;
            padding: 48px 44px;
            width: 100%;
            max-width: 440px;
            color: #fff;
        }
        .login-box h2 {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 28px;
        }
        .form-control {
            background: rgba(255,255,255,0.95);
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.95rem;
            margin-bottom: 14px;
            font-family: 'Poppins', sans-serif;
        }
        .form-control:focus { box-shadow: 0 0 0 3px rgba(46,196,182,0.3); outline: none; }
        .btn-login {
            width: 100%;
            background: #2ec4b6;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 4px;
        }
        .btn-login:hover { background: #22a89e; }
        .signup-link {
            text-align: center;
            margin-top: 16px;
            font-size: 0.88rem;
            color: rgba(255,255,255,0.78);
        }
        .signup-link a { color: #e63946; font-weight: 600; text-decoration: none; }
        .signup-link a:hover { text-decoration: underline; }
        .alert { font-size: 0.88rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login to Your Account</h2>

        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="text" name="username" class="form-control" placeholder="Username" required autofocus>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
            <button type="submit" class="btn-login">Login</button>
        </form>

        <p class="signup-link">Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
