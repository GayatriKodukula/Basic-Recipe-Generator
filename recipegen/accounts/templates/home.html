<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1543362906-acfc16c67564?w=1600&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-box {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            padding: 60px 60px;
            text-align: center;
            color: #fff;
            max-width: 560px;
            width: 90%;
        }
        .hero-title {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .hero-title i { color: #f5a623; margin-right: 10px; }
        .hero-sub {
            font-size: 1rem;
            color: rgba(255,255,255,0.82);
            margin-bottom: 36px;
            font-weight: 300;
        }
        .btn-signup {
            background: #e63946;
            color: #fff;
            border: none;
            padding: 12px 38px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            margin-right: 12px;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s, transform 0.15s;
        }
        .btn-signup:hover { background: #c0303c; color: #fff; transform: translateY(-2px); }
        .btn-login {
            background: #2ec4b6;
            color: #fff;
            border: none;
            padding: 12px 38px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s, transform 0.15s;
        }
        .btn-login:hover { background: #22a89e; color: #fff; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="hero-box">
        <h1 class="hero-title">
            <i class="fas fa-utensils"></i>Welcome to Recipe Generator
        </h1>
        <p class="hero-sub">Discover delicious recipes instantly!</p>
        <a href="{% url 'signup' %}" class="btn-signup">Sign Up</a>
        <a href="{% url 'login' %}" class="btn-login">Login</a>
    </div>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
